name: publish

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { toolchain: stable, name: check }
          - { toolchain: stable, name: check, features: --all-features }
          - { toolchain: "1.88", name: check, features: --all-features } # MSRV
          - { toolchain: stable, name: test, features: --all-features }
          - { toolchain: stable, name: test, features: --doc --all-features }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2.9.2
      - name: ${{ matrix.name }} (${{ matrix.toolchain }} ${{ matrix.features }})
        run: cargo ${{ matrix.name }} ${{ matrix.features }} --quiet

  publish:
    name: crates.io
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      id-token: write # trusted publishing (OIDC) — no stored API token
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Verify tag matches Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          test "$tag" = "$manifest" || {
            echo "tag $GITHUB_REF_NAME != Cargo.toml version $manifest"
            exit 1
          }

      - name: Verify the index does not already have this version
        shell: bash
        run: |
          curl -sfH "User-Agent: ${{ github.repository }} (crates.io publish check)" \
            "https://index.crates.io/ll/m-/llm-dialect" \
            | jq -r .vers | grep -qxF "$GITHUB_REF_NAME" && {
              echo "$GITHUB_REF_NAME is already published"; exit 1
            } || true

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --all-features --token ${{ steps.auth.outputs.token }}
